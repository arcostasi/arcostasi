<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Anderson Costa — Embedded Systems</title>
  <desc id="desc">Cyberpunk terminal banner with a CAN bus signal motif in cyan and magenta.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080b18"/><stop offset=".55" stop-color="#11152b"/><stop offset="1" stop-color="#1a0c29"/></linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#35f2ff"/><stop offset="1" stop-color="#ff4bd8"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#7d8ab8" stroke-opacity=".13"/></pattern>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="320" rx="22" fill="url(#bg)"/><rect width="1200" height="320" rx="22" fill="url(#grid)"/>
  <path d="M20 54H1180M20 266H1180" stroke="url(#neon)" stroke-opacity=".6"/>
  <circle cx="42" cy="30" r="6" fill="#ff4bd8"/><circle cx="63" cy="30" r="6" fill="#ffd166"/><circle cx="84" cy="30" r="6" fill="#35f2ff"/>
  <text x="112" y="35" fill="#a8b3d1" font-family="Consolas,monospace" font-size="14">/usr/bin/anderson — embedded systems console</text>
  <text x="70" y="128" fill="#35f2ff" font-family="Consolas,monospace" font-size="17" filter="url(#glow)">&gt; boot_profile --engineer</text>
  <text x="70" y="185" fill="#f4f6ff" font-family="Consolas,monospace" font-size="43" font-weight="700">ANDERSON COSTA</text>
  <text x="72" y="222" fill="#ff73df" font-family="Consolas,monospace" font-size="19">EMBEDDED SOFTWARE ENGINEER</text>
  <text x="72" y="250" fill="#b8c2dc" font-family="Consolas,monospace" font-size="15">firmware  •  CAN / J1939 / ISOBUS  •  low-level systems</text>
  <g transform="translate(795 104)" fill="none" stroke="url(#neon)" stroke-width="3" filter="url(#glow)"><path d="M0 0H70L94 22H168L193 0H286"/><path d="M0 60H42L66 82H145L169 60H227L251 82H286"/><path d="M0 120H92L116 98H201L225 120H286"/><path d="M18 0V60M112 22V82M193 0V60M258 82V120"/></g>
  <g fill="#d7e3ff" font-family="Consolas,monospace" font-size="12"><text x="798" y="94">CAN_RX</text><text x="1064" y="94">CAN_TX</text><text x="802" y="244">0x18FF50E5</text><text x="1028" y="244">BUS: ONLINE</text></g>
  <rect x="20" y="20" width="1160" height="280" rx="18" fill="none" stroke="url(#neon)" stroke-opacity=".55"/>
</svg>
