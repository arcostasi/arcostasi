<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Anderson Costa — Embedded Systems</title>
  <desc id="desc">Cyberpunk terminal banner with an oscilloscope-style CAN_H and CAN_L waveform.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080b18"/><stop offset=".55" stop-color="#11152b"/><stop offset="1" stop-color="#1a0c29"/></linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#35f2ff"/><stop offset="1" stop-color="#ff4bd8"/></linearGradient>
    <linearGradient id="traceH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb547"/><stop offset="1" stop-color="#ff4bd8"/></linearGradient>
    <linearGradient id="traceL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#35f2ff"/><stop offset="1" stop-color="#589bff"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#7d8ab8" stroke-opacity=".13"/></pattern>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="320" rx="22" fill="url(#bg)"/><rect width="1200" height="320" rx="22" fill="url(#grid)"/>
  <path d="M20 54H1180M20 266H1180" stroke="url(#neon)" stroke-opacity=".6"/>
  <circle cx="42" cy="30" r="6" fill="#ff4bd8"/><circle cx="63" cy="30" r="6" fill="#ffd166"/><circle cx="84" cy="30" r="6" fill="#35f2ff"/>
  <text x="112" y="35" fill="#a8b3d1" font-family="Consolas,monospace" font-size="14">/usr/bin/arcostasi — embedded systems console</text>
  <text x="70" y="128" fill="#35f2ff" font-family="Consolas,monospace" font-size="17" filter="url(#glow)">&gt; boot_profile --engineer</text>
  <text x="70" y="185" fill="#f4f6ff" font-family="Consolas,monospace" font-size="43" font-weight="700">ANDERSON COSTA</text>
  <text x="72" y="222" fill="#ff73df" font-family="Consolas,monospace" font-size="19">EMBEDDED SOFTWARE ENGINEER</text>
  <text x="72" y="250" fill="#b8c2dc" font-family="Consolas,monospace" font-size="15">firmware  •  CAN / J1939 / ISOBUS  •  low-level systems</text>

  <g>
    <rect x="748" y="70" width="414" height="184" rx="12" fill="#080d1a" fill-opacity=".96" stroke="#526184" stroke-opacity=".72"/>
    <path d="M748 101H1162" stroke="#526184" stroke-opacity=".55"/>
    <circle cx="766" cy="86" r="4" fill="#ff4bd8"/><circle cx="780" cy="86" r="4" fill="#ffd166"/><circle cx="794" cy="86" r="4" fill="#35f2ff"/>
    <text x="810" y="90" fill="#a8b3d1" font-family="Consolas,monospace" font-size="11">SCOPE // ISO 11898-2</text>
    <text x="1080" y="90" fill="#35f2ff" font-family="Consolas,monospace" font-size="10">LIVE TRACE</text>

    <g stroke="#667394" stroke-opacity=".34" stroke-width="1" stroke-dasharray="3 5">
      <path d="M824 116V219M855 116V219M886 116V219M917 116V219M948 116V219M979 116V219M1010 116V219M1041 116V219M1072 116V219M1103 116V219M1134 116V219"/>
      <path d="M824 134H1134M824 165H1134M824 196H1134"/>
    </g>
    <g fill="#8190b1" font-family="Consolas,monospace" font-size="9" text-anchor="end">
      <text x="817" y="137">3.5</text><text x="817" y="168">2.5</text><text x="817" y="199">1.5</text>
    </g>
    <text x="758" y="145" fill="#ff8c64" font-family="Consolas,monospace" font-size="9">H</text>
    <text x="758" y="187" fill="#35f2ff" font-family="Consolas,monospace" font-size="9">L</text>
    <g fill="#c5cee4" font-family="Consolas,monospace" font-size="9" text-anchor="middle">
      <text x="839" y="112">1</text><text x="870" y="112">0</text><text x="901" y="112">1</text><text x="932" y="112">0</text><text x="963" y="112">1</text><text x="994" y="112">1</text><text x="1025" y="112">0</text><text x="1056" y="112">1</text><text x="1087" y="112">0</text><text x="1118" y="112">1</text>
    </g>
    <path d="M824 165H855L858 134H883L886 165H917L920 134H945L948 165H979H1010L1013 134H1038L1041 165H1072L1075 134H1100L1103 165H1134" fill="none" stroke="url(#traceH)" stroke-width="2.5" stroke-linejoin="round" filter="url(#glow)"/>
    <path d="M824 165H855L858 196H883L886 165H917L920 196H945L948 165H979H1010L1013 196H1038L1041 165H1072L1075 196H1100L1103 165H1134" fill="none" stroke="url(#traceL)" stroke-width="2.5" stroke-linejoin="round" filter="url(#glow)"/>
    <path d="M824 165H1134" stroke="#aab6d4" stroke-opacity=".28" stroke-dasharray="2 4"/>
    <text x="824" y="237" fill="#ffb547" font-family="Consolas,monospace" font-size="9">CAN_H</text>
    <text x="871" y="237" fill="#35f2ff" font-family="Consolas,monospace" font-size="9">CAN_L</text>
    <text x="1041" y="237" fill="#a8b3d1" font-family="Consolas,monospace" font-size="9">0 = DOMINANT</text>
    <text x="1116" y="248" fill="#8190b1" font-family="Consolas,monospace" font-size="8" text-anchor="end">TIME →</text>
  </g>
  <rect x="20" y="20" width="1160" height="280" rx="18" fill="none" stroke="url(#neon)" stroke-opacity=".55"/>
</svg>
